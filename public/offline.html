<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="./favicon.png">
  <title>Grace Panjaitan - Quality Assurance Analyst / Engineer</title>
  <!-- This page intentionally loads NO external fonts or resources,
       since it is shown when there is no internet connection. -->
  <style>
    :root {
      --bg: #F8F7F6;
      --card: #FFFFFF;
      --ink: #1E1702;
      --soft: #595643;
      --border: #E5E3E4;
      --accent: #047C58;
      --accent-hover: #036346;
      --accent-soft: rgba(4, 124, 88, 0.1);
      --accent-border: rgba(4, 124, 88, 0.26);
      --accent-ink: #035B40;
      --olive-soft: rgba(140, 136, 107, 0.14);
      --shadow-sm: 0 1px 2px rgba(30, 23, 2, 0.05), 0 1px 3px rgba(30, 23, 2, 0.04);
      --shadow-md: 0 10px 26px -10px rgba(30, 23, 2, 0.14);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1E1702;
        --card: #291E07;
        --ink: #F2F0F1;
        --soft: #BAB49D;
        --border: rgba(229, 227, 228, 0.13);
        --accent: #18A97D;
        --accent-hover: #2AC293;
        --accent-soft: rgba(4, 124, 88, 0.26);
        --accent-border: rgba(24, 169, 125, 0.38);
        --accent-ink: #82E6C6;
        --olive-soft: rgba(140, 136, 107, 0.2);
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.34);
        --shadow-md: 0 14px 32px -10px rgba(0, 0, 0, 0.6);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.65;
      padding: 20px;
    }

    .wrap {
      max-width: 460px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 16px;
      background: var(--olive-soft);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 28px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-ink);
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      padding: 5px 14px;
      border-radius: 9999px;
      margin-bottom: 18px;
    }

    .status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .3;
      }
    }

    h1 {
      font-size: clamp(22px, 5vw, 28px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 10px;
    }

    p {
      color: var(--soft);
      font-size: 15px;
      margin-bottom: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      padding: 10px 24px;
      border-radius: 12px;
      border: none;
      color: #FFFFFF;
      background: var(--accent);
      box-shadow: var(--shadow-sm);
      transition: transform 0.16s ease, background-color 0.16s ease, box-shadow 0.16s ease;
    }

    .btn:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .foot-note {
      margin-top: 22px;
      font-size: 12px;
      font-weight: 500;
      color: var(--soft);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="icon" aria-hidden="true">📡</div>
    <div class="status"><span class="dot"></span>status: OFFLINE · 0 passed, 1 failed</div>
    <h1>Connection lost</h1>
    <p>This page needs the internet, and right now there isn't any.
      Check your connection, then run the test again.</p>
    <button class="btn" onclick="location.reload()">↻ Retry connection</button>
    <div class="foot-note">build: portofolio-v5.0.0</div>
  </div>
</body>

</html>
